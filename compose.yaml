services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: darivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-darivo_local_only}
      POSTGRES_DB: darivo
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - darivo_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darivo -d darivo']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  darivo_pg:
