name: Darivo checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: darivo
          POSTGRES_PASSWORD: darivo_ci
          POSTGRES_DB: darivo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U darivo" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://darivo:darivo_ci@localhost:5432/darivo
      AUTH_SECRET: ci-only-secret-for-synthetic-test-accounts
      AUTH_URL: http://localhost:3000
      DEMO_MODE: 'true'
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate && pnpm db:migrate && pnpm db:seed
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && pnpm eval
      - name: Verify runner Chrome
        run: google-chrome --version
      - run: pnpm test:e2e
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-evidence
          path: /tmp/darivo-e2e-results
          retention-days: 7
      - run: pnpm build
      - name: Production Lighthouse checks
        env:
          LIGHTHOUSE_OUTPUT_DIR: /tmp/darivo-lighthouse-report
        run: |
          AUTH_URL=http://localhost:3001 pnpm start --port 3001 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          pnpm test:performance
      - name: Retain Lighthouse diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: /tmp/darivo-lighthouse-report
          if-no-files-found: ignore
          retention-days: 7
